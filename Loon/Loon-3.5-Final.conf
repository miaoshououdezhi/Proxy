# Loon 3.5 | 中国大陆直连 | 阿里/Cloudflare DoH | IPv6 双栈
# 核实日期 2026-09-08。需添加真实节点和订阅，并在 App 关闭普通 DNS 回落。
# 国内域名的阿里 DoH 映射已拆为远程插件，由下方 [Plugin] 自动加载。

[General]
ip-mode = dual
allow-wifi-access = false
udp-fallback-mode = REJECT
hijack-dns = *:53
# 仅作为兼容/引导候选；必须在 App 关闭加密 DNS 失败回落，避免普通查询回落明文。
dns-server = 223.5.5.5
doh-server = https://cloudflare-dns.com/dns-query
proxy-test-url = http://cp.cloudflare.com/generate_204
internet-test-url = http://wifi.vivo.com.cn/generate_204
test-timeout = 5

[Proxy]
# 将本地节点的 Loon 原生定义粘贴在这里，或在导入后用 App 添加。
# 不生成虚构节点。请保留节点的正确协议、TLS 和 UDP 参数。

[Remote Proxy]
# 取消下一行注释，并把占位符替换为你的一个 Loon 节点订阅 URL。
# MySubscription = REPLACE_WITH_LOON_SUBSCRIPTION_URL

[Remote Filter]
# 默认范围为全部节点；导入后确认同时包含本地及订阅节点。
AllNodes = NameRegex,FilterKey=".*"

[Proxy Group]
Auto = url-test,AllNodes,url=http://cp.cloudflare.com/generate_204,interval=900,tolerance=100
Manual = select,AllNodes
Proxy = select,Auto,Manual

[Plugin]
https://raw.githubusercontent.com/miaoshououdezhi/Proxy/main/Loon/China-AliDNS.lpx,tag=国内域名阿里DoH,enabled=true

[Host]
# DoH 主机引导地址；仅固定解析器连接地址，不关闭目标网站的 AAAA 查询。
dns.alidns.com = 223.5.5.5
cloudflare-dns.com = 1.1.1.1
# 必须为以域名连接的每个代理服务器添加精确的阿里解析映射，避免引导依赖。
# YOUR_NODE_HOSTNAME = server:https://dns.alidns.com/dns-query
# 订阅域名若需要直连更新，可同样指定阿里解析，并在 Rule 开头添加 DIRECT。
# YOUR_SUBSCRIPTION_HOSTNAME = server:https://dns.alidns.com/dns-query

[Rule]
# 用户例外规则可放在这里。
DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
# 解析器连接规则；Loon 自身 DNS 连接是否遵循这些规则须在 App 内验证。
DOMAIN,dns.alidns.com,DIRECT
IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
DOMAIN,cloudflare-dns.com,Proxy
IP-CIDR,1.1.1.1/32,Proxy,no-resolve
# 未命中远程国内规则的流量走代理。
FINAL,Proxy

[Remote Rule]
# blackmatrix7 Loon 原生 ChinaMax；在 App 远程规则页面更新。
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ChinaMax/ChinaMax.list,policy=DIRECT,tag=ChinaMax,enabled=true
